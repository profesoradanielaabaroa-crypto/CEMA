<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="login-card" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">¡Bienvenido!</h1>
    <p class="text-slate-500 text-sm mb-6">Inicia sesión o regístrate para continuar</p>

    <!-- Botón de Google -->
    <button id="btn-google" class="w-full border border-slate-300 py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-50 transition font-medium text-slate-700 mb-4">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continuar con Google
    </button>

    <div class="relative my-4">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">o con correo</span></div>
    </div>

    <!-- Formulario Tradicional -->
    <form id="auth-form" class="space-y-4">
      <input type="email" id="email" placeholder="Correo electrónico" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Ingresar / Registrarse</button>
    </form>
    <p id="error-msg" class="text-red-500 text-xs mt-3 hidden"></p>
  </div>

  <!-- Panel de usuario cuando ya entró -->
  <div id="user-card" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center hidden">
    <h2 class="text-xl font-bold text-slate-800 mb-1">¡Sesión Iniciada con Éxito! 🎉</h2>
    <p class="text-slate-500 text-sm mb-4">Tu cuenta ya está guardada de verdad en Firebase.</p>
    <div class="bg-slate-50 p-4 rounded-xl mb-6 border border-slate-100">
      <p class="text-xs text-slate-400 uppercase font-bold">Tu correo registrado:</p>
      <p id="user-email" class="text-base font-semibold text-slate-700"></p>
    </div>
    <button id="btn-logout" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition">Cerrar Sesión</button>
  </div>

  <!-- Conexión a Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Tus llaves reales de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCO2XqQtTfLCkfP9Fco2ujtkgJsbp8CnEE",
      authDomain: "cema-defeb.firebaseapp.com",
      projectId: "cema-defeb",
      storageBucket: "cema-defeb.firebasestorage.app",
      messagingSenderId: "838212424549",
      appId: "1:838212424549:web:6130003b74ad9751a3c78c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Detectar si la persona ya está dentro
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('user-card').classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
      } else {
        document.getElementById('login-card').classList.remove('hidden');
        document.getElementById('user-card').classList.add('hidden');
      }
    });

    // Entrar con Google
    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        showError(err.message);
      }
    });

    // Entrar o Registrarse con Correo
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      
      try {
        // Intenta ingresar
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        // Si no existe la cuenta, la crea automáticamente
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
          } catch (createErr) {
            showError(createErr.message);
          }
        } else {
          showError(err.message);
        }
      }
    });

    // Cerrar sesión
    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    function showError(msg) {
      const errEl = document.getElementById('error-msg');
      errEl.innerText = msg;
      errEl.classList.remove('hidden');
    }
  </script>
</body>
</html>
